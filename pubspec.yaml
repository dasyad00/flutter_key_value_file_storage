name: flutter_key_value_file_storage
description: An implementation to save big chunks of content to a file
version: 0.1.1
homepage: https://github.com/icapps/flutter_key_value_file_storage

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  device_info_plus: ">=12.3.0 <13.0.0"
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=9.0.0 <11.0.0"
  path: ">=1.9.1 <2.0.0"
  path_provider: ">=2.1.5 <3.0.0"
  synchronized: ">=3.4.0 <4.0.0"

dev_dependencies:
  build_runner: ">=2.4.6 <3.0.0"
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  mockito: ">=5.6.1 <6.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.icapps.flutter_key_value_file_storage
        pluginClass: FlutterKeyValueFileStoragePlugin
      ios:
        pluginClass: FlutterKeyValueFileStoragePlugin
